name: Generate private TIM-SO-KHAC video and upload to YouTube

on:
  workflow_dispatch:
    inputs:
      game_count:
        description: Number of puzzles (1-40)
        required: true
        default: '40'
      seed:
        description: Random seed
        required: true
        default: '20260917'

permissions:
  contents: read

concurrency:
  group: tim-so-khac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    defaults:
      run:
        shell: bash
        working-directory: private-source

    env:
      PRIVATE_REPO: "colfleshjadein2404997-oss/TIM-SO-KHAC"
      PRIVATE_REF: "main"
      PYTHONUNBUFFERED: "1"

      QUIZ_GAME_COUNT: "${{ inputs.game_count }}"
      QUIZ_SEED: "${{ inputs.seed }}"
      QUIZ_WIDTH: "1920"
      QUIZ_HEIGHT: "1080"
      QUIZ_FPS: "60"
      QUIZ_OUTPUT_DIR: "dist"
      QUIZ_WORK_DIR: "work"

      # YouTube upload is intentionally fixed to PRIVATE.
      YT_PRIVACY_STATUS: "private"
      YT_TITLE: "脳トレ！数字・文字さがし40問｜観察力チャレンジ"
      YT_DESCRIPTION: |-
        数字と文字の中から、ひとつだけ違うものを見つける観察力クイズです。
        全40問。集中力・観察力・脳トレに挑戦してみてください。

        #脳トレ #観察力 #間違い探し #クイズ

      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - name: Check required secrets
        working-directory: .
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          missing=0
          for name in PRIVATE_REPO_TOKEN YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout private TIM-SO-KHAC source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: private-source/requirements.txt

      - name: Validate inputs and private source
        run: |
          if ! [[ "$QUIZ_GAME_COUNT" =~ ^([1-9]|[1-3][0-9]|40)$ ]]; then
            echo "::error::game_count must be from 1 to 40; got: $QUIZ_GAME_COUNT"
            exit 1
          fi
          if ! [[ "$QUIZ_SEED" =~ ^-?[0-9]+$ ]]; then
            echo "::error::seed must be an integer; got: $QUIZ_SEED"
            exit 1
          fi
          for file in generate_quiz_jp.py puzzles_jp.json requirements.txt; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing private source file: $file"
              exit 1
            fi
          done
          python -m py_compile generate_quiz_jp.py

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install google-api-python-client google-auth google-auth-httplib2

      - name: Generate Japanese quiz video
        run: python generate_quiz_jp.py

      - name: Verify rendered video
        run: |
          shopt -s nullglob
          videos=(dist/*.mp4)
          if [ "${#videos[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one MP4 in dist/, found ${#videos[@]}"
            ls -lah dist/ || true
            exit 1
          fi
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of json "${videos[0]}"

      - name: Upload to YouTube as private
        run: |
          python - <<'PYCODE'
          import glob
          import os
          from pathlib import Path

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          videos = sorted(glob.glob("dist/*.mp4"))
          if len(videos) != 1:
              raise SystemExit(f"Expected exactly one rendered MP4, found {len(videos)}")

          required = ("YT_CLIENT_ID", "YT_CLIENT_SECRET", "YT_REFRESH_TOKEN")
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit("Missing YouTube secrets: " + ", ".join(missing))

          privacy = os.getenv("YT_PRIVACY_STATUS", "private").strip().lower()
          if privacy != "private":
              raise SystemExit("Safety check failed: YT_PRIVACY_STATUS must remain 'private'")

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YT_REFRESH_TOKEN"].strip(),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YT_CLIENT_ID"].strip(),
              client_secret=os.environ["YT_CLIENT_SECRET"].strip(),
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          creds.refresh(Request())

          youtube = build("youtube", "v3", credentials=creds, cache_discovery=False)
          path = Path(videos[0])
          title = os.getenv("YT_TITLE", "脳トレ！数字・文字さがし｜観察力チャレンジ").strip()[:100]
          description = os.getenv("YT_DESCRIPTION", "").strip()

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title,
                      "description": description,
                      "categoryId": "27",
                      "defaultLanguage": "ja",
                      "defaultAudioLanguage": "ja",
                  },
                  "status": {
                      "privacyStatus": "private",
                  },
              },
              media_body=MediaFileUpload(
                  str(path),
                  mimetype="video/mp4",
                  chunksize=8 * 1024 * 1024,
                  resumable=True,
              ),
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status is not None:
                  print(f"YouTube upload: {status.progress() * 100:.1f}%")

          video_id = response.get("id")
          if not video_id:
              raise SystemExit(f"YouTube API returned no video id: {response}")
          print(f"Uploaded PRIVATE YouTube video id: {video_id}")
          PYCODE

      - name: Remove local render files
        if: always()
        run: |
          rm -rf dist work
          echo "No GitHub artifact is uploaded by this workflow."
